# Прод-режим (локальный запуск): Nginx отдаёт статику собранного web/dist
# и проксирует /api на api-бинарь, запущенный на хосте (§3.2, §10 ТЗ).
# TLS/HSTS/certbot добавляются при реальном деплое — здесь локальный HTTP.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Структурный access-log (§6) можно расширить позже; здесь — стандартный.
    access_log /var/log/nginx/access.log;

    # api запущен на хосте; из контейнера хост доступен как host.docker.internal
    # (для Linux это имя добавляется через extra_hosts в compose).
    upstream fluxscope_api {
        server host.docker.internal:5049;
    }

    # Базовый rate-limit на /api (§9): 60 req/min с IP, burst для всплесков.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=1r/s;

    # Отдельная строгая зона для /wallet/*/apps: один такой запрос порождает
    # fan-out installedapps по ВСЕМ нодам кошелька (пачками по 25) — сотни
    # обращений к Flux API. Кэш (10 мин) спасает только при повторе того же
    # адреса, поэтому перебор чужих адресов ограничиваем отдельно.
    limit_req_zone $binary_remote_addr zone=api_apps_rl:10m rate=10r/m;

    # Dynamic rendering: ботам/AI-краулерам отдаём prerender-снимок (полный HTML),
    # людям — обычный SPA. Снимок генерит scripts/gen-prerender.sh раз в сутки.
    map $http_user_agent $is_bot {
        default 0;
        "~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-Web|anthropic|PerplexityBot|Googlebot|Google-Extended|bingbot|CCBot|Applebot|Bytespider|YandexBot|facebookexternalhit|Twitterbot|Slackbot|Discordbot|LinkedInBot)" 1;
    }

    server {
        listen 80;
        server_name _;

        # Статика собранного фронта.
        root /usr/share/nginx/html;
        index index.html;

        # --- Security-заголовки (§9). ---
        # always — чтобы заголовки шли и на ответах-ошибках (4xx/5xx).
        # HSTS здесь НЕ ставим: этот конфиг обслуживает локальный HTTP, а на проде
        # TLS терминирует внешний nginx (см. nginx-fluxradar-frontproxy.conf).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP: шрифты грузятся с Google Fonts, инлайновые <script> (анти-FOUC и
        # ld+json) разрешены по sha256 — при их правке в web/index.html хеши надо
        # пересчитать, иначе страница молча останется без темы.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TVd9w/ZKA3+ponBYK3njZtCu+99EXa9gdWh8VaUUvDw=' 'sha256-iYXjLcTGPJIJXR1GFVspW+H0I0NrjJrwLS4ce3nIlpQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Хэшированные ассеты Vite — кэшируем агрессивно.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Дорогой fan-out эндпоинт — строгий лимит. Regex-локация проверяется
        # раньше префиксной /api/, поэтому объявлена выше неё.
        location ~ ^/api/v1/wallet/[^/]+/apps$ {
            limit_req zone=api_apps_rl burst=5 nodelay;
            proxy_pass http://fluxscope_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Fan-out идёт секунды–десятки секунд: даём запас против 504.
            proxy_read_timeout 120s;
        }

        # API → бинарь на хосте.
        location /api/ {
            limit_req zone=api_rl burst=60 nodelay;
            proxy_pass http://fluxscope_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Корень: ботам — prerender-снимок (если есть), людям — SPA.
        location = / {
            if ($is_bot) {
                rewrite ^ /prerender.html last;
            }
            try_files /index.html =404;
        }

        # SPA-fallback: любой не-API маршрут отдаёт index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
