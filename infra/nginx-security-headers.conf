# Security-заголовки FluxRadar (§9 ТЗ) — общий сниппет для TLS-блока на хосте.
#
# Установка на сервере, где терминируется HTTPS (прод: Beget):
#   sudo cp infra/nginx-security-headers.conf /etc/nginx/snippets/fluxradar-security.conf
# затем внутри `server { listen 443 ssl; ... }` (блок, который дописал certbot):
#   include snippets/fluxradar-security.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Почему отдельным файлом: certbot переписывает свои строки в конфиге домена,
# и заголовки, вписанные туда руками, теряются при обновлении сертификата.
#
# `always` — чтобы заголовки уходили и с ответами-ошибками (4xx/5xx), иначе
# страница 404/502 остаётся без защиты.

# HSTS: только там, где реально есть HTTPS. Год + поддомены.
# preload НЕ включён намеренно — попадание в preload-список необратимо и
# ломает любой поддомен без TLS; включать осознанно и отдельно.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Запрет MIME-sniffing: браузер не «додумывает» тип за Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Анти-clickjacking. frame-ancestors в CSP ниже — современный эквивалент,
# X-Frame-Options оставлен для старых браузеров.
add_header X-Frame-Options "DENY" always;

# Реферер: на сторонние домены уходит только origin, и только по HTTPS.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Отключаем ненужные браузерные API (сервису они не нужны).
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP. Тонкости, из-за которых политика именно такая:
#   script-src  — два инлайновых <script> в web/index.html (анти-FOUC тема и
#                 ld+json) разрешены по sha256, без 'unsafe-inline'. ПРИ ПРАВКЕ
#                 этих скриптов хеши надо пересчитать, иначе тема молча отвалится:
#                 python3 -c "import hashlib,base64,sys; print(base64.b64encode(hashlib.sha256(open(sys.argv[1],'rb').read()).digest()).decode())" script.js
#   style-src   — 'unsafe-inline' нужен: Tailwind/React проставляют inline-стили,
#                 плюс CSS Google Fonts.
#   connect-src — свой /api; сторонних вызовов из браузера нет (§3.3 ТЗ).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TVd9w/ZKA3+ponBYK3njZtCu+99EXa9gdWh8VaUUvDw=' 'sha256-iYXjLcTGPJIJXR1GFVspW+H0I0NrjJrwLS4ce3nIlpQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
